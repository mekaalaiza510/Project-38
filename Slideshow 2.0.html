<!DOCTYPE html>

<html>

    <body>
        
        <section>

            <img class="mySlides" src="img1.jpg" style="height:500px;" alt="Image 1">

            <img class="mySlides" src="img2.jpg" style="height:500px;" alt="Image 2">

            <img class="mySlides" src="img3.jpg" style="height:500px;" alt="Image 3">

            <img class="mySlides" src="img4.jpg" style="height:500px;" alt="Image 4">

            <img class="mySlides" src="img5.jpg" style="height:500px;" alt="Image 5">

        </section>

        <script>
            
            var myIndex = 0;

            carousel();

            function carousel() {

                var i;
                var slides = document.getElementsByClassName("mySlides");

                for (i = 0; i < slides.length; i++) {

                    slides[i].style.display = "none";

                }

                myIndex++;

                if (myIndex > slides.length) {

                    myIndex = 1

                }

                slides[myIndex - 1].style.display = "block";
                setTimeout(carousel, 3000);
                
            }

        </script>

    </body>

</html>
